name: AI Code Review
on:
  push:
  pull_request:

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get diff
        id: diff
        run: |
          # 拉取完整历史（checkout 默认 shallow），以便对比父提交
          git fetch --unshallow 2>/dev/null || true
          # push 事件：对比上一次提交；PR 事件：对比 base
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # push：对比父提交（若无父提交则为首个提交本身）
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
            HEAD=$(git rev-parse HEAD)
          fi
          echo "对比 $BASE → $HEAD"
          git diff "$BASE" "$HEAD" > /tmp/diff.txt
          echo "diff 大小: $(wc -c < /tmp/diff.txt) 字节"
          echo "base=$BASE" >> $GITHUB_ENV
          echo "head=$HEAD" >> $GITHUB_ENV

      - name: Run AI Review
        env:
          AI_REVIEW_API_URL: ${{ vars.AI_REVIEW_API_URL }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITEA_URL: http://192.168.1.69:13000
        run: |
          python3 .gitea/scripts/ai_review.py /tmp/diff.txt "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ github.sha }}" || echo "审查脚本执行失败"

      - name: Commit review report
        run: |
          # 把审查报告提交回仓库 .review/ 目录
          git config user.name "gitea-actions"
          git config user.email "actions@noreply.local"
          if [ -n "$(ls .review/ 2>/dev/null)" ]; then
            git add .review/
            git commit -m "docs: AI review report for ${{ github.sha }}" || echo "无变更无需提交"
            git push "http://x-access-token:${GITHUB_TOKEN}@server:3000/${{ github.repository }}.git" HEAD:main || echo "推送报告失败"
          fi
